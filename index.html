      .search-box { display: flex; align-items: center; gap: 1.5rem; min-height: 4.75rem; padding: 0 1.75rem; border: 1px solid rgba(255,255,255,.085); border-radius: 1.5rem; background: #10141e; color: var(--faint); transition: border-color 150ms; }

      .launch-all, .open-button { display: inline-flex; align-items: center; justify-content: center; gap: .75rem; border: 0; background: linear-gradient(115deg, #0cba8c, #009571); color: white; font-weight: 700; }

    <script>

        {

          title: "影视 App",
          category: "应用体验",
          accent: "cyan",
          description: "影视内容浏览、详情查看与社区互动流程的移动端交互 Demo。",
          url: "http://118.25.109.46/yingshi-app-jiaohu/"
        },
        {
          code: "WORK_T1",
          title: "优化编辑器",
          category: "工具后台",
          accent: "amber",
          description: "蓝白新版编辑器的优化预览版本，聚焦更清晰的编辑体验与工具型质感。",
          url: "http://118.25.109.46/lanbai-xinban-bianjiqi/"
        },
        {
          code: "WORK_D1",
          title: "监测面板",
          category: "工具后台",
          accent: "coral",
          description: "股票监测、回测、资金查询和每日感悟等模块的综合监测台。",
          url: "http://118.25.109.46/monitor-dashboard/"
        },
        {
          code: "WORK_A1",
          title: "AI编辑器",
          category: "AI探索",
          accent: "violet",
          description: "面向小游戏生成与编辑的 AI 工具型 Demo，支持多种玩法预览。",
          url: "http://118.25.109.46/ai-editor/"
        },
        {
          code: "WORK_G2",
          title: "游戏 App",
          category: "游戏互动",
          accent: "cyan",
          description: "游戏应用方案展示页，集中呈现游戏产品体验和 App 化包装。",
          url: "http://118.25.109.46/youxi-app/"
        }
      ];

      const grid = document.getElementById("worksGrid");
      const searchInput = document.getElementById("searchInput");
      const resultCount = document.getElementById("resultCount");
      const emptyState = document.getElementById("emptyState");
      const toast = document.getElementById("toast");
      let currentFilter = "全部";
      let toastTimer = 0;

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function getFilteredWorks() {
        const keyword = searchInput.value.trim().toLowerCase();
        return works.filter((work) => {
          const filterMatch = currentFilter === "全部" || work.category === currentFilter;
          const haystack = `${work.title} ${work.category} ${work.description} ${work.url}`.toLowerCase();
          return filterMatch && (!keyword || haystack.includes(keyword));
        });
      }

      function renderWorks() {
        const visibleWorks = getFilteredWorks();
        resultCount.textContent = `${visibleWorks.length} ITEMS AVAILABLE`;
        document.getElementById("openVisible").disabled = visibleWorks.length === 0;
        emptyState.classList.toggle("is-visible", visibleWorks.length === 0);
        grid.innerHTML = visibleWorks
          .map(
            (work) => `
              <article class="work-card" data-category="${escapeHtml(work.category)}">
                <div class="work-top">
                  <span class="work-code">${escapeHtml(work.code)}</span>
                  <span class="work-category">${escapeHtml(work.category)}</span>
                </div>
                <h3>${escapeHtml(work.title)}</h3>
                <p>${escapeHtml(work.description)}</p>
                <div class="url-line" title="${escapeHtml(work.url)}">${icon("link")}<span>${escapeHtml(work.url)}</span></div>
                <div class="actions">
                  <a class="open-button" href="${escapeHtml(work.url)}" target="_blank" rel="noopener noreferrer">
                    打开 ${icon("arrow")}
                  </a>
                  <button class="copy-button" type="button" data-url="${escapeHtml(work.url)}">
                    复制 ${icon("copy")}
                  </button>
                </div>
              </article>
            `
          )
          .join("");
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("is-visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("is-visible"), 1700);
      }

      async function copyLink(url) {
        try {
          await navigator.clipboard.writeText(url);
          showToast("链接已复制");
        } catch (error) {
          const helper = document.createElement("textarea");
          helper.value = url;
          helper.setAttribute("readonly", "");
          helper.style.position = "fixed";
          helper.style.left = "-999px";
          document.body.appendChild(helper);
          helper.select();
          try {
            const copied = document.execCommand("copy");
            showToast(copied ? "链接已复制" : "复制失败，请手动复制作品链接");
          } catch {
            showToast("复制失败，请手动复制作品链接");
          } finally {
            helper.remove();
          }
        }
      }

      const filterControls = document.querySelectorAll(".filter-button, .metric[data-filter]");

      function setFilter(filter) {
        currentFilter = filter;
        filterControls.forEach((item) => {
          item.setAttribute("aria-pressed", String(item.dataset.filter === filter));
        });
        renderWorks();
      }

      document.querySelectorAll(".metric[data-filter]").forEach((button) => {
        const count = works.filter((work) => button.dataset.filter === "全部" || work.category === button.dataset.filter).length;
        button.querySelector(".metric-value strong").textContent = count;
      });

      filterControls.forEach((button) => {
        button.addEventListener("click", () => setFilter(button.dataset.filter));
      });

      searchInput.addEventListener("input", renderWorks);

      grid.addEventListener("click", (event) => {
        const copyButton = event.target.closest(".copy-button");
        if (!copyButton) return;
        copyLink(copyButton.dataset.url);
      });

      document.getElementById("openVisible").addEventListener("click", () => {
        const visibleWorks = getFilteredWorks();
        visibleWorks.forEach((work) => window.open(work.url, "_blank", "noopener,noreferrer"));
      });

      setFilter("全部");
    </script>
  </body>
</html>
